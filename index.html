<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="light dark" />

        <!-- Swapped for per-game metadata on /game/{code} by the Go server (server/static.go) -->
        <!-- seo:start -->
        <title>Alias · The fake name party game · Play free online</title>
        <meta name="description" content="%SEO_DESCRIPTION%" />
        <meta name="robots" content="index, follow, max-image-preview:large" />
        <link rel="canonical" href="https://alias.party/" />
        <meta property="og:url" content="https://alias.party/" />
        <meta property="og:title" content="Alias · The fake name party game" />
        <meta property="og:description" content="%SEO_DESCRIPTION%" />
        <meta name="twitter:title" content="Alias · The fake name party game" />
        <meta name="twitter:description" content="%SEO_DESCRIPTION%" />
        <!-- seo:end -->

        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Alias" />
        <meta property="og:locale" content="en_US" />
        <meta property="og:image" content="https://alias.party/og.png" />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="Alias: a party game about fake names and wrong guesses. Free, no app, 4+ players."
        />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:image" content="https://alias.party/og.png" />
        <meta
            name="twitter:image:alt"
            content="Alias: a party game about fake names and wrong guesses. Free, no app, 4+ players."
        />

        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f9ff" />
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070e1b" />
        <meta name="apple-mobile-web-app-title" content="Alias" />

        <!-- seo:jsonld -->

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@500..800&family=Google+Sans+Flex:opsz,wdth,wght,ROND@6..144,100..151,400..1000,0..100&display=swap"
        />
        <!-- Keep icon_names sorted and in sync with src/components/icon.tsx -->
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&icon_names=add,arrow_back,arrow_forward,celebration,check,check_circle,close,error,fullscreen,fullscreen_exit,home,play_arrow,replay,timer,undo&display=block"
        />

        <!-- Home theme surface, painted before the JS theme loads -->
        <style>
            html {
                background: #f9f9ff;
            }
            @media (prefers-color-scheme: dark) {
                html {
                    background: #070e1b;
                }
            }
            /* Crawler-readable copy; React replaces it on load */
            .seo-content {
                position: absolute;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip-path: inset(50%);
                white-space: nowrap;
            }
        </style>

        <script
            defer
            src="https://cdn.visitors.now/v.js"
            data-token="%VITE_VISITORS_TOKEN%"
        ></script>
    </head>
    <body>
        <div id="root"><!-- seo:content --></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
